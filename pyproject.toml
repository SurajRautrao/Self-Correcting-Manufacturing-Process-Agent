[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmpa"
version = "0.1.0"
description = "Self-Correcting Manufacturing Process Agent: a research prototype for constraint-guided CNC process-plan generation and repair."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suraj Balaji Rautrao" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
eval = [
    "matplotlib>=3.8,<4",
]
# M6 sequence optimizer (Google OR-Tools CP-SAT)
opt = [
    "ortools>=9.10,<10",
]
app = [
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scmpa = ["prompt_templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ollama: needs a running local Ollama server (enable with SCMPA_TEST_OLLAMA=1)",
]
